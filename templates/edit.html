<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Employee</h2>

    <form method="POST">

        <!-- CSRF Security Token -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">

        <label>Employee Name</label>

        <input
            type="text"
            name="name"
            value="{{ employee['name'] }}"
            maxlength="100"
            required>

        <label>Department</label>

        <input
            type="text"
            name="department"
            value="{{ employee['department'] }}"
            maxlength="100"
            required>

        <button type="submit">Update Employee</button>

        <a href="{{ url_for('home') }}" class="back">Cancel</a>

    </form>

</div>

</body>
</html>
